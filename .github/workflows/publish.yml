name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-marketplace
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Install
        working-directory: vscode
        run: npm ci

      - name: Test
        working-directory: vscode
        run: npm test

      - name: Tag release
        id: tag
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git checkout "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git describe --exact-match --tags HEAD >/dev/null 2>&1; then
            echo "HEAD is already tagged: $(git describe --exact-match --tags HEAD)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="$(node -p "require('./vscode/package.json').version")"
          tag="v${version}"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; bumping patch version"
            npm --prefix vscode version patch --no-git-tag-version
            version="$(node -p "require('./vscode/package.json').version")"
            tag="v${version}"
            git add vscode/package.json vscode/package-lock.json
            git commit -m "chore: release ${tag}"
          else
            echo "Creating tag ${tag} for the current version"
          fi

          git tag "$tag"
          git push origin "HEAD:${BRANCH}"
          git push origin "$tag"

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Publish to Visual Studio Marketplace
        if: steps.tag.outputs.skip != 'true'
        working-directory: vscode
        run: npx --yes @vscode/vsce publish --oidc --skip-duplicate
