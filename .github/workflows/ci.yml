name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: vscode

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Package
        run: npx @vscode/vsce package --allow-missing-repository

      - uses: actions/upload-artifact@v4
        with:
          name: vscode-highlighter
          path: vscode/*.vsix
